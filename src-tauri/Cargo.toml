[package]
name = "ariekei"
version = "0.0.3"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[lib]
name = "ariekei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[features]
# Remote control for the end-to-end tests (src/e2e.rs); never part of a release build.
e2e = []

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-notification = "=2.5.0"
tauri-plugin-opener = "=2.6.0"
anyhow = "=1.0.104"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
