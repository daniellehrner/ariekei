[package]
name = "ariekei"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"

[lib]
name = "ariekei_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
agent-client-protocol = "=2.2.0"
anyhow = "=1.0.104"
async-trait = "=0.1.92"
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["process", "rt-multi-thread", "macros", "sync", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.27.0"
